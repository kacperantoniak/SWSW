<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>System Wypożyczalni</mat-card-title>
      <mat-card-subtitle>Zaloguj się, aby kontynuować</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Login</mat-label>
          <input matInput formControlName="login" placeholder="Wpisz login">
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Hasło</mat-label>
          <input matInput type="password" formControlName="haslo" placeholder="Wpisz hasło">
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage">
          {{errorMessage}}
        </div>

        <button mat-raised-button color="primary" type="submit" class="full-width"
          [disabled]="loginForm.invalid || isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
          <span *ngIf="!isLoading">Zaloguj się</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
